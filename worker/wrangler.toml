name = "entropic-proxy"
main = "src/index.js"
compatibility_date = "2026-01-01"
workers_dev = true

[vars]
# Pages allowed to call the proxy from a browser.
ALLOWED_ORIGINS = "https://ishanjmukherjee.github.io,http://localhost:8000"
# Characters per request (one scoring window plus its context).
MAX_PROMPT_CHARS = "30000"
# Characters scored per UTC day across all visitors. At about 4 characters
# per token and $3 per million tokens this is roughly $0.45 a day.
DAILY_CHAR_BUDGET = "600000"

[[kv_namespaces]]
binding = "USAGE"
id = "48ab5aa0dddd42419dd8914c95d1e4b6"

# Requests per visitor IP per minute.
[[ratelimits]]
name = "PER_VISITOR"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
